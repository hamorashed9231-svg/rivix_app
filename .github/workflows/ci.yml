name: CI / CD Pipeline - Quality & Infrastructure Automation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  web-ci:
    name: Web Platform (Next.js) - Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: restaurant-platform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: restaurant-platform/package.json

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: ESLint Check
        run: npm run lint

      - name: Run Automated Vitest Unit & Integration Tests
        run: npm test

      - name: Verify Next.js Build
        run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"

  mobile-ci:
    name: Mobile App (Expo / React Native) - Lint, Typecheck & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: ESLint Check
        run: npm run lint

      - name: Run Automated Jest Unit Tests
        run: npm test
